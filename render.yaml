services:
  - type: web
    name: coindcx-trading-bot-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_SECRET_KEY
        value: dev-secret-key
      - key: CORS_ORIGIN
        value: "*"
      - key: TRADING_MODE
        value: LIVE_TRADING
      - key: DEFAULT_PAIR
        value: BTCINR
      - key: DEFAULT_STRATEGY
        value: TREND_PULLBACK_PRO
      - key: DEFAULT_LEVERAGE
        value: "1"
      - key: MAX_TRADE_AMOUNT
        value: "2500"
      - key: MAX_LOSS_PERCENT
        value: "1.5"
      - key: PROFIT_LOCK_LEVELS
        value: "3.5,5.5,8,12,15"
      - key: BREAKEVEN_TRIGGER_PERCENT
        value: "2.5"
      - key: FEE_DEDUCTION_PERCENT
        value: "1.5"
      - key: MONGODB_URI
        sync: false
      - key: COINDCX_API_KEY
        sync: false
      - key: COINDCX_API_SECRET
        sync: false
