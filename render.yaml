services:
  - type: web
    name: coindcx-trading-bot-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_SECRET_KEY
        value: dev-secret-key
      - key: CORS_ORIGIN
        value: "*"
      - key: TRADING_MODE
        value: LIVE_TRADING
      - key: DEFAULT_PAIR
        value: BTCINR
      - key: DEFAULT_STRATEGY
        value: TREND_4H
      - key: DEFAULT_LEVERAGE
        value: "5"
      - key: MAX_TRADE_AMOUNT
        value: "4000"
      - key: PROFIT_LOCK_LEVELS
        value: "1.8,3,5,7,9,11,13,15"
      - key: MONGODB_URI
        sync: false
      - key: COINDCX_API_KEY
        sync: false
      - key: COINDCX_API_SECRET
        sync: false
